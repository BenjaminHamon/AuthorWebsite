# cspell:words setuptools

[build-system]
requires = [ "setuptools ~= 82.0.1" ]
build-backend = "setuptools.build_meta"

[project]
name = "automation-scripts"
version = "1.0.0+development"
description = "Automation scripts for the local project"
requires-python = ">= 3.11"

authors = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

maintainers = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "bhamon-development-toolkit ~= 3.1.1",
    "twine ~= 6.2.0",
]

[project.optional-dependencies]
dev = [
    "mockito ~= 2.0.3",
    "pylint ~= 4.0.5",
    "pytest ~= 9.0.3",
    "pytest-asyncio ~= 1.3.0",
    "pytest-json ~= 0.4.0",
]

[project.scripts]
automation = "automation_scripts.run_command:main"

[tool.setuptools.packages.find]
include = [ "automation_scripts", "automation_scripts.*" ]
