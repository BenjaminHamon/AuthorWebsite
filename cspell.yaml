# cspell:words pycache

---

files:
  - "**"
  - "**/.*/**"

ignorePaths:
  - ".git/**"
  - ".venv-automation/**"
  - ".venv/**"
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/*.egg-info/**"
  - "Artifacts/**"

language: en

words:
  - asyncio
  - benjaminhamon
  - bhamon
  - gunicorn
  - hamon
  - pylint
  - pytest
  - venv

overrides:
  - filename: "*.html"
    dictionaries:
      - html
